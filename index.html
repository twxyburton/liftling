function softRenderAfterBlur(){ const a = document.activeElement; if (a && a.blur) a.blur(); softRender(); }
let armed = null;
view.addEventListener('click', async e => {
  const t = e.target;
  /* workout */
  const pick = t.closest('[data-pick]');
  if (pick) {
    const k = pick.dataset.pick; if (k === state.day) return;
    const hasWork = state.draft.entries.some(en => en.sets.some(s => s.r !== ''));
    state.day = k; state.draft = newDraft(k);
    if (hasWork) toast('Switched workouts. Unsaved sets were cleared.');
    persistDraft(); render(true);
    const pl = view.querySelector('.plate[aria-pressed="true"]'); if (pl) pl.classList.add('spin');
    return;
  }
  if (t.closest('[data-plan]')) { state.tab = 'workout'; state.sub = 'plan'; render(true); window.scrollTo(0,0); return; }
  if (t.closest('[data-back]')) { state.sub = null; render(true); window.scrollTo(0,0); return; }
  /* plan editor */
  const dow = t.closest('[data-dow]');
  if (dow) {
    const p = store.plan, d = Number(dow.dataset.dow);
    if (p.days.includes(d)) { if (p.days.length === 1) { toast('Keep at least one gym day.'); return; } p.days = p.days.filter(x => x !== d); }
    else p.days = p.days.concat(d).sort((a,b) => a-b);
    planChanged(); rerender(); return;
  }
  const sum = t.closest('summary[data-exkey]');
  if (sum) { state.openEx = sum.parentElement.open ? null : sum.dataset.exkey; return; }
  if (t.closest('[data-addw]')) {
    const p = store.plan;
    if (p.workouts.length >= 6) return;
    const w = {id:newId('w'), name:'Workout ' + LETTERS[p.workouts.length], ex:[]};
    p.workouts.push(w); state.picker = w.id; state.pickQ = '';
    planChanged(); rerender(); return;
  }
  const delw = t.closest('[data-delw]');
  if (delw) {
    const id = delw.dataset.delw;
    if (armed === 'w:' + id) {
      armed = null; store.plan.workouts = store.plan.workouts.filter(w => w.id !== id);
      if (state.picker === id) state.picker = null;
      planChanged(); rerender(); toast('Workout deleted. Your logged sessions stay in Progress.'); return;
    }
    armed = 'w:' + id; delw.dataset.armed = '1'; delw.textContent = 'Tap again to delete';
    setTimeout(() => { if (armed === 'w:' + id) { armed = null; delw.dataset.armed = ''; delw.textContent = 'Delete workout'; } }, 4000);
    return;
  }
  const openPick = t.closest('[data-openpick]');
  if (openPick) { state.picker = openPick.dataset.openpick; state.pickQ = ''; rerender(); return; }
  if (t.closest('[data-closepick]')) { state.picker = null; rerender(); return; }
  const addEx = t.closest('[data-addex]');
  if (addEx) {
    const [wid, exId] = addEx.dataset.addex.split(':'), w = workoutById(wid);
    if (!w || w.ex.some(x => x.id === exId)) return;
    if (w.ex.length >= 12) { toast('A workout can have up to 12 exercises.'); return; }
    w.ex.push(Object.assign({id:exId}, defTarget(exInfo(exId).kind)));
    planChanged(); rerender(); toast(`Added ${exInfo(exId).name}`); return;
  }
  const addCustom = t.closest('[data-addcustom]');
  if (addCustom) {
    const w = workoutById(addCustom.dataset.addcustom), name = $('#cxName').value.trim().slice(0, 40), kind = KINDS[$('#cxKind').value] ? $('#cxKind').value : 'weight';
    if (!name) { toast('Give your exercise a name first.'); return; }
    if (!w) return;
    if (w.ex.length >= 12) { toast('A workout can have up to 12 exercises.'); return; }
    const id = 'cx_' + (slug(name) || 'move') + '_' + Math.random().toString(36).slice(2, 6);
    store.plan.custom[id] = {name, kind, cue:$('#cxCue').value.trim().slice(0, 200)};
    w.ex.push(Object.assign({id}, defTarget(kind)));
    planChanged(); rerender(); toast(`Added ${name}`); return;
  }
  const mv = t.closest('[data-mv]');
  if (mv) {
    const [wid, exId, dir] = mv.dataset.mv.split(':'), w = workoutById(wid), i = w ? w.ex.findIndex(x => x.id === exId) : -1, j = i + Number(dir);
    if (i < 0 || j < 0 || j >= w.ex.length) return;
    [w.ex[i], w.ex[j]] = [w.ex[j], w.ex[i]];
    planChanged(); rerender(); return;
  }
  const rmEx = t.closest('[data-rmex]');
  if (rmEx) {
    const [wid, exId] = rmEx.dataset.rmex.split(':'), w = workoutById(wid);
    if (w) { w.ex = w.ex.filter(x => x.id !== exId); state.openEx = null; planChanged(); rerender(); }
    return;
  }
  /* coach + AI */
  if (t.closest('[data-coach]') || t.closest('[data-askai]')) {
    const age = Number(store.plan.profile.age);
    if (!(age >= 8 && age <= 99)) { toast('Add your age first so the plan uses safe sets and reps.'); const a = view.querySelector('[data-prof="age"]'); if (a) a.focus(); return; }
    store.plan.profile = cleanProfile(store.plan.profile); saveDoc('plan', store.plan);
    if (t.closest('[data-coach]')) { state.rec = coachPlan(); rerender(); return; }
    if (state.recBusy) return;
    state.recBusy = t.closest('[data-askai]').dataset.askai; rerender();
    try { state.rec = await askAiPlan(state.recBusy); } catch(err) { toast(err.message || 'The AI request failed. Try again.'); }
    state.recBusy = false; rerender(); return;
  }
  if (t.closest('[data-userec]') && state.rec) {
    useRec(state.rec); state.rec = null; rerender();
    toast(`New plan saved. Next up: ${workoutById(state.day).name}.`); return;
  }
  if (t.closest('[data-droprec]')) { state.rec = null; rerender(); return; }
  if (t.closest('[data-gosettings]')) {
    state.back = state.tab; state.tab = 'settings'; render(true);
    const h = $('#h-ai'); if (h) h.scrollIntoView({block:'start'}); return;
  }
  const done = t.closest('[data-done]');
  if (done) {
    const [ex, i] = done.dataset.done.split(':');
    const s = state.draft.entries.find(x=>x.ex===ex).sets[+i];
    s.done = !s.done; done.setAttribute('aria-pressed', String(s.done));
    if (s.done && !s.r) { const kind = exInfo(ex).kind; s.r = kind==='time'?'30':kind==='reps'?'15':'12'; const inp = document.getElementById(`r-${ex}-${i}`); if (inp) inp.value = s.r; }
    if (s.done) { startRest(90); try { if (navigator.vibrate) navigator.vibrate(12); } catch(x){} }
    persistDraft(); return;
  }
  const add = t.closest('[data-addset]');
  if (add) {
    const en = state.draft.entries.find(x=>x.ex===add.dataset.addset), prev = en.sets[en.sets.length-1];
    en.sets.push({w: prev ? prev.w : '', r:'', done:false});
    persistDraft(); const y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if (t.closest('#finish')) {
    const d = state.draft;
    const logged = d.entries.reduce((a,en)=>a+en.sets.filter(s=>s.r!=='').length,0);
    if (!logged && !Number(d.cardio.min)) { toast('Fill in reps for at least one set first.'); return; }
    const s = {...d, ts:Date.now(), cardio:{type:d.cardio.type, min:Number(d.cardio.min)||0},
      entries: d.entries.map(en=>({ex:en.ex, nm:exInfo(en.ex).name, sets:en.sets.filter(x=>x.r!=='').map(x=>({w:x.w, r:Number(x.r)}))})).filter(en=>en.sets.length)};
    const prs = newRecords(s), ok = saveSession(s);
    lsDel('liftling.draft'); stopRest();
    toast(!ok ? 'This browser couldn’t store the workout. Export a backup in Settings before closing.'
      : prs.length ? `New record! ${prs[0]}${prs.length > 1 ? ` and ${prs.length - 1} more` : ''}` : `Saved ${d.wname}. Nice work!`);
    state.day = nextWorkout(); state.draft = newDraft(state.day); state.touched = false;
    state.tab = 'progress'; render(true); window.scrollTo(0,0);
    if (ok) celebrate();
    return;
  }
  /* food */
  const cup = t.closest('[data-cup]');
  if (cup) {
    const f = JSON.parse(JSON.stringify(store.food)), {k, d} = foodDay();
    const n = Number(cup.dataset.cup), cur = Number(d.water)||0;
    f.days = f.days || {}; f.days[k] = Object.assign({meals:{}, water:0}, f.days[k]); f.days[k].water = (n === cur) ? n-1 : n; f.days = pruneKeys(f.days, 30);
    saveDoc('food', f); state.cupFrom = cur; rerender(); state.cupFrom = null;
    if (n === 8 && cur < 8) celebrate();
    return;
  }
  const mp = t.closest('[data-mealpick]');
  if (mp) { state.meal = mp.dataset.mealpick; state.seed = 0; softRender(); return; }
  if (t.closest('[data-shuffle]')) { state.seed++; softRender(); return; }
  const chip = t.closest('[data-food]');
  if (chip) {
    const f = JSON.parse(JSON.stringify(store.food)), id = chip.dataset.food, set = new Set(f.skip || []);
    set.has(id) ? set.delete(id) : set.add(id); f.skip = [...set];
    saveDoc('food', f);
    const det = chip.closest('details'); const y = window.scrollY; render(); window.scrollTo(0,y);
    if (det) { const nd = view.querySelector('details.foods'); if (nd) nd.open = true; }
    return;
  }
  /* sleep */
  const goal = t.closest('[data-goal]');
  if (goal) { const s = JSON.parse(JSON.stringify(store.sleep)); s.goal = Number(goal.dataset.goal); saveDoc('sleep', s); softRender(); return; }
  if (t.closest('[data-savesleep]')) {
    const bed = $('#bedLog').value, wake = $('#wakeLog').value;
    if (!bed || !wake) { toast('Enter both times first.'); return; }
    const s = JSON.parse(JSON.stringify(store.sleep)); s.nights = s.nights || {};

    saveDoc('sleep', s); state.sleepBed = null; state.sleepWake = null;
    toast(`Saved ${fmtDur(durOf(bed, wake))} of sleep`); softRenderAfterBlur(); return;
  }
  /* settings */
  if (t.closest('[data-close-settings]')) { closeSettings(); return; }
  if (t.closest('[data-export]')) { exportData(); return; }
  if (t.closest('[data-import]')) { $('#importFile').click(); return; }

  if (t.closest('[data-lswitch]')) { toggleLocal(); return; }
  if (t.closest('[data-lauto]')) { const auto = !localCfg().auto; saveLocalCfg({auto}); if (auto) warmLocal(); rerender(); return; }
  const lsize = t.closest('[data-lsize]');

    const i = Number(lsize.dataset.lsize), c = localCfg();

    rerender(); return;
  }
  const ldl = t.closest('[data-ldl]');
  if (ldl) { local.confirm = Number(ldl.dataset.ldl); rerender(); return; }
  const ldlGo = t.closest('[data-ldl-go]');
  if (ldlGo) { downloadLocal(Number(ldlGo.dataset.ldlGo)); return; }
  if (t.closest('[data-ldl-cancel]')) { local.confirm = null; rerender(); return; }
  if (t.closest('[data-lstop]')) { stopLocal(); return; }
  const ldel = t.closest('[data-ldel]');
  if (ldel) {
    if (local.armed) { local.armed = false; await deleteLocal(); rerender(); return; }
    local.armed = true; ldel.dataset.armed = '1'; ldel.textContent = 'Tap again to remove';
    setTimeout(() => { if (local.armed) { local.armed = false; ldel.dataset.armed = ''; ldel.textContent = 'Remove from this device'; } }, 4000);
    return;
  }
  if (t.closest('[data-install]') && installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch(x){} installEvt = null; rerender(); return; }
  /* coach chat + weekly tips */
  if (t.closest('[data-send]')) { const i = $('#chatIn'); sendChat(i ? i.value : ''); return; }
  const ask = t.closest('[data-ask]');
  if (ask) { sendChat(ask.dataset.ask); return; }
  if (t.closest('[data-clearchat]')) { state.chat = []; state.chatSeen = 0; lsDel('liftling.chat'); rerender(); return; }
  if (t.closest('[data-review]')) { runReview(); return; }
  if (t.closest('[data-aiclear]')) { const c = aiCfg(); c.key = ''; lsSet('liftling.ai', c); rerender(); toast('Key removed from this device'); return; }
  if (t.closest('[data-import-go]') && state.importing) {
    const ok = applyBackup(state.importing.b); state.importing = null;
    toast(ok ? `Imported. You now have ${plural(store.sessions.length, 'workout')}.` : 'Imported for now, but this browser couldn’t store it.');
    softRender(); return;
  }
  /* progress */
  const del = t.closest('[data-del]');
  if (del) {
    e.preventDefault();
    if (armed === del.dataset.del) { armed = null; await deleteSession(del.dataset.del); toast('Workout deleted'); }
    else { armed = del.dataset.del; del.dataset.armed = '1'; del.textContent = 'Tap again to delete'; setTimeout(()=>{ if (armed === del.dataset.del){ armed=null; del.dataset.armed=''; del.textContent='Delete'; } }, 4000); }
  }
});

initStore();
loadDraft();

/* offline + install only work on a real web address, not a file opened from disk */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

try { navigator.storage.persist().catch(() => {}); } catch(e){}
setInterval(() => { if (state.tab === 'workout' && !state.sub) { const tl = view.querySelector('.timeline'); if (tl) tl.outerHTML = timelineHtml(true); } }, 60000);
})();

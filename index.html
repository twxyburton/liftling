<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liftling</title>
<meta name="description" content="Log workouts, food and sleep. Everything stays on this device.">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liftling">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231D59C4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23EEF1F4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column, app-style bottom tab bar; each workout wears a bumper-plate colour (A blue, B yellow, C green, D red, E purple, F orange). */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F3F5F8; --ink:#131A21; --muted:#5F6A77; --line:#DEE3E9; --line-strong:#C9D0D8;
  --plate-a:#1D59C4; --plate-b:#E3A900; --plate-c:#23855A; --plate-ink-b:#2A2100;
  --plate-d:#C8402E; --plate-e:#7A4FC9; --plate-f:#E07A2E; --plate-ink-f:#2A1300;
  --night:#4A57C9; --good:#23855A; --warn:#C2362C;
  --day:var(--plate-a); --day-ink:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --nav-h:64px;
  --shadow:0 1px 2px rgba(19,26,33,.05),0 2px 8px rgba(19,26,33,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#171E26; --sunk:#11171D; --ink:#E7ECF1; --muted:#97A3B0; --line:#25303B; --line-strong:#33404D;
  --plate-a:#5D8FF0; --plate-b:#F2C23A; --plate-c:#4CBE86; --plate-ink-b:#2A2100;
  --plate-d:#E8604E; --plate-e:#9A78EC; --plate-f:#F29A5C; --plate-ink-f:#2A1300;
  --night:#8E9BFF; --good:#4CBE86; --warn:#F0675C;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#171E26; --sunk:#11171D; --ink:#E7ECF1; --muted:#97A3B0; --line:#25303B; --line-strong:#33404D;
  --plate-a:#5D8FF0; --plate-b:#F2C23A; --plate-c:#4CBE86; --plate-ink-b:#2A2100;
  --plate-d:#E8604E; --plate-e:#9A78EC; --plate-f:#F29A5C; --plate-ink-f:#2A1300;
  --night:#8E9BFF; --good:#4CBE86; --warn:#F0675C;
  --shadow:none; color-scheme:dark;
}
body[data-day="A"]{--day:var(--plate-a); --day-ink:#FFFFFF}
body[data-day="B"]{--day:var(--plate-b); --day-ink:var(--plate-ink-b)}
body[data-day="C"]{--day:var(--plate-c); --day-ink:#FFFFFF}
body[data-day="D"]{--day:var(--plate-d); --day-ink:#FFFFFF}
body[data-day="E"]{--day:var(--plate-e); --day-ink:#FFFFFF}
body[data-day="F"]{--day:var(--plate-f); --day-ink:var(--plate-ink-f)}
body[data-tab="sleep"]{--day:var(--night); --day-ink:#FFFFFF}

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.wrap{max-width:620px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--day); outline-offset:2px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
p{margin:0}

/* header */
.top .wrap{padding-block:18px 4px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{margin:0; font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:.04em; text-transform:uppercase; line-height:1}
.brand{display:flex; align-items:center; gap:9px}
.brand .mark{flex:none; width:22px; height:22px; border-radius:50%; background:radial-gradient(circle, #131A21 0 2.5px, #EEF1F4 3px 5.5px, var(--day) 6px)}
.sync{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--muted)}
.sync[data-state="local"] i{background:var(--plate-b)}
.sync[data-state="off"] i{background:var(--warn)}
.top-r{margin-left:auto; display:flex; align-items:center; gap:12px; min-width:0}
.gear{flex:none; width:40px; height:40px; padding:0; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--muted); display:grid; place-items:center}
.gear svg{width:20px; height:20px}
.gear[aria-pressed="true"]{background:var(--day); border-color:var(--day); color:var(--day-ink)}

main .wrap{padding-block:12px calc(var(--nav-h) + 110px); display:grid; gap:14px}
.hero{display:grid; gap:2px; padding-top:6px}
.eyebrow{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
h2{margin:0; font-family:var(--display); font-weight:700; font-size:30px; letter-spacing:.01em; text-transform:uppercase; line-height:1.05; text-wrap:balance}
h3{margin:0; font-size:17px; font-weight:600; line-height:1.25}
.sect{margin-top:10px; display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.sect h4{margin:0; font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:.06em; text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}

/* tab bar */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid; grid-template-columns:repeat(4,1fr); height:var(--nav-h)}
.nav button{background:none; border:0; display:grid; place-items:center; align-content:center; gap:3px; color:var(--muted); font-size:12px; font-weight:600; letter-spacing:.03em}
.nav svg{width:24px; height:24px}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav button[aria-selected="true"] svg{color:var(--day)}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:grid; gap:12px; min-width:0; box-shadow:var(--shadow)}
.card.tight{gap:0; padding:4px 16px}

/* day plates */
.plates{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.plate{display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--surface); border:1px solid var(--line); border-radius:999px; text-align:left; min-width:0}
.disc{flex:none; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:17px; position:relative}
.disc[data-d="A"]{background:var(--plate-a); color:#fff}
.disc[data-d="B"]{background:var(--plate-b); color:var(--plate-ink-b)}
.disc[data-d="C"]{background:var(--plate-c); color:#fff}
.disc[data-d="D"]{background:var(--plate-d); color:#fff}
.disc[data-d="E"]{background:var(--plate-e); color:#fff}
.disc[data-d="F"]{background:var(--plate-f); color:var(--plate-ink-f)}
.disc[data-d="X"]{background:var(--line-strong); color:var(--ink)}
.plate .t{min-width:0; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.plate[aria-pressed="true"]{border-color:var(--day); background:color-mix(in srgb,var(--day) 10%,var(--surface))}
@media (max-width:380px){.plate{justify-content:center} .plate .t{display:none}}

/* timeline */
.timeline{display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
.timeline div{padding:8px 8px 9px; border-radius:10px; background:var(--sunk); min-width:0}
.timeline .tm{font-family:var(--mono); font-size:12px; color:var(--muted)}
.timeline .ph{font-size:13px; font-weight:600; line-height:1.2}
.timeline .now{background:var(--day); color:var(--day-ink)}

/* plan editor */
.dows{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.dows button{height:40px; padding:0; min-width:0; border-radius:10px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--muted); font-weight:600; font-size:13px}
.dows button[aria-pressed="true"]{background:var(--day); border-color:var(--day); color:var(--day-ink)}
.formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
.field > .label{display:block; margin-bottom:6px}
.wk-head{display:flex; align-items:center; gap:10px}
.wk-head input{flex:1; min-width:0; height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--sunk); font-weight:600; font-size:17px}
.wk-head input:focus{border-color:var(--day); outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--day) 25%,transparent)}
.exrow{border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow summary{list-style:none; cursor:pointer; display:grid; grid-template-columns:20px 1fr auto; gap:10px; align-items:center; padding:11px 0}
.exrow summary::-webkit-details-marker{display:none}
.exrow .i{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:center}
.exrow .nm{min-width:0; font-weight:600; font-size:15px; overflow-wrap:anywhere}
.exrow .tg{font-family:var(--mono); font-size:13px; color:var(--muted); white-space:nowrap}
.exrow[open] summary .tg{color:var(--ink)}
.exedit{display:grid; gap:10px; padding:0 0 14px 30px}
.nums{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.nums .field input{padding:0 8px; text-align:center}
.mini{display:flex; gap:6px; flex-wrap:wrap}
.mini button{height:36px; padding:0 12px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:14px}
.mini button:disabled{opacity:.4}
.mini .rm{color:var(--warn); margin-left:auto}
.picker{border:1px solid var(--line); border-radius:12px; background:var(--sunk); padding:12px; display:grid; gap:10px}
.picker .field input{background:var(--surface); padding-right:12px; font-family:var(--body); font-size:16px}
.pick-list{display:grid; max-height:340px; overflow:auto; overscroll-behavior:contain}
.pick-list .grp{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:10px 2px 4px}
.pick-list button{display:flex; justify-content:space-between; align-items:baseline; gap:10px; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:10px 2px; font-size:15px; font-weight:500}
.pick-list .eq{font-size:12px; color:var(--muted); white-space:nowrap}
.rec h5{margin:6px 0 0; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.timeline .now .tm{color:inherit; opacity:.85}

/* checklist rows */
.tick{display:flex; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line); cursor:pointer}
.tick:first-child{border-top:0}
.tick input{appearance:none; flex:none; width:26px; height:26px; margin:0; border:1.5px solid var(--line-strong); border-radius:8px; background:var(--surface); display:grid; place-items:center; cursor:pointer}
.tick input:checked{background:var(--day); border-color:var(--day)}
.tick input:checked::after{content:""; width:7px; height:12px; border:solid var(--day-ink); border-width:0 3px 3px 0; transform:translateY(-1px) rotate(45deg)}
.tick .tx{flex:1; min-width:0}
.tick .tx b{display:block; font-weight:600}
.tick .tx span{font-size:14px; color:var(--muted)}
.tick .when{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap}

/* exercise */
.ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.ex-head .tgt{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; padding:3px 8px; border-radius:999px; background:var(--sunk)}
.last{font-size:13px; color:var(--muted); margin-top:2px}
.up{display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; padding:6px 10px; border-radius:999px; background:color-mix(in srgb,var(--day) 14%,var(--surface)); justify-self:start}
.up svg{width:14px; height:14px; color:var(--day)}
.sets{display:grid; gap:8px}
.set{display:grid; grid-template-columns:28px 1fr 1fr 46px; gap:8px; align-items:center}
.set .n{font-family:var(--mono); font-size:13px; color:var(--muted); text-align:center}
.set.head{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.08em; text-transform:uppercase; margin-bottom:-4px}
.field{position:relative; min-width:0; display:block}
.field input,.field select{width:100%; height:46px; padding:0 40px 0 12px; border:1px solid var(--line); border-radius:10px; background:var(--sunk); font-family:var(--mono); font-size:17px; font-variant-numeric:tabular-nums}
.field select{font-family:var(--body); font-size:16px; padding-right:12px}
.field input[type="time"]{padding-right:12px}
.field input:focus,.field select:focus{border-color:var(--day); outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--day) 25%,transparent)}
.field .u{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--muted); pointer-events:none}
.field.solo{grid-column:2 / 4}
.check{height:46px; border-radius:10px; border:1.5px solid var(--line-strong); background:var(--surface); display:grid; place-items:center; color:var(--muted)}
.check svg{width:20px; height:20px}
.check[aria-pressed="true"]{background:var(--day); border-color:var(--day); color:var(--day-ink)}
.ex-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.linkbtn{background:none; border:0; padding:4px 0; color:var(--ink); font-weight:600; font-size:14px; text-decoration:underline; text-decoration-color:var(--day); text-decoration-thickness:2px; text-underline-offset:4px}
details.how summary{list-style:none; cursor:pointer; font-size:14px; font-weight:600; color:var(--muted)}
details.how summary::-webkit-details-marker{display:none}
details.how[open] summary{color:var(--ink)}
details.how p{font-size:14px; color:var(--muted); margin-top:8px; flex-basis:100%}
.ex-foot details.how[open]{flex-basis:100%; order:3}
.row2{display:grid; grid-template-columns:1.3fr 1fr; gap:10px}
textarea{width:100%; border:1px solid var(--line); border-radius:10px; background:var(--sunk); padding:10px 12px; min-height:70px; resize:vertical}
.label{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.primary{height:54px; border:0; border-radius:var(--r); background:var(--day); color:var(--day-ink); font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:.08em; text-transform:uppercase}
.primary:disabled{opacity:.5}
.secondary{height:44px; border:1.5px solid var(--line-strong); border-radius:10px; background:var(--surface); padding:0 14px; font-weight:600}

/* segmented */
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; padding:4px; background:var(--sunk); border-radius:12px; border:1px solid var(--line)}
.seg button{border:0; background:none; border-radius:9px; padding:9px 4px; font-weight:600; font-size:14px; color:var(--muted); min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* food */
.water{display:flex; gap:6px; flex-wrap:wrap}
.cup{width:34px; height:40px; border:0; background:none; padding:0; color:var(--line-strong)}
.cup svg{width:100%; height:100%}
.cup[data-full="1"]{color:var(--plate-a)}
.cup[data-full="0"] .fill{opacity:0}
.legend{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center}
.legend div{background:var(--sunk); border-radius:10px; padding:8px 4px; min-width:0}
.legend b{display:block; font-size:13px}
.legend span{font-size:12px; color:var(--muted)}
.legend.three{grid-template-columns:repeat(3,1fr)}
.legend.three b{font-family:var(--display); font-weight:700; font-size:26px; line-height:1.1}
.opt{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:8px; background:var(--sunk)}
.opt-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.opt-top b{font-size:15px}
.opt-top .num{font-size:13px; color:var(--muted); white-space:nowrap}
.opt ul{margin:0; padding:0; list-style:none; display:grid; gap:4px}
.opt li{display:flex; justify-content:space-between; gap:12px; font-size:15px}
.opt li span:last-child{color:var(--muted); font-size:14px; text-align:right}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1.5px solid var(--line-strong); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:14px; font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.chip[aria-pressed="false"]{color:var(--muted); text-decoration:line-through}
details.foods summary{cursor:pointer; font-weight:600; list-style:none; display:flex; justify-content:space-between}
details.foods summary::-webkit-details-marker{display:none}
details.foods[open] summary{margin-bottom:10px}
.swaps{display:grid; gap:0}
.swaps div{display:grid; grid-template-columns:1fr 20px 1fr; gap:8px; padding:9px 0; border-top:1px solid var(--line); font-size:15px; align-items:center}
.swaps div:first-child{border-top:0}
.swaps .arr{color:var(--muted); text-align:center}
.note{font-size:13px; color:var(--muted); padding:0 4px}

/* sleep */
.bigtime{font-family:var(--display); font-weight:700; font-size:48px; line-height:1; letter-spacing:.01em}
.steps{display:grid; gap:0}
.steps div{display:grid; grid-template-columns:86px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--line); align-items:baseline}
.steps .num{font-size:15px}
.steps span:last-child{font-size:15px}
.dur{font-family:var(--display); font-weight:700; font-size:28px}
.chart svg{width:100%; height:auto; display:block}

/* progress */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center}
.week .d{display:grid; gap:4px; justify-items:center; font-size:12px; color:var(--muted)}
.week .dot{width:30px; height:30px; border-radius:50%; border:2px dashed var(--line-strong); display:grid; place-items:center}
.week .sched .dot{border-style:solid}
.week .done .dot{border:0; background:var(--good)}
.week .done .dot::after{content:""; width:6px; height:11px; border:solid #fff; border-width:0 3px 3px 0; transform:translateY(-1px) rotate(45deg)}
.week .is-today{color:var(--ink); font-weight:700}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px; min-width:0; box-shadow:var(--shadow)}
.stat .v{font-family:var(--display); font-weight:700; font-size:30px; line-height:1}
.stat .v small{font-size:17px; color:var(--muted)}
.stat .k{font-size:13px; color:var(--muted); margin-top:4px}
.lift{display:grid; grid-template-columns:1fr auto 100px; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--line)}
.lift:first-child{border-top:0}
.lift .nm{min-width:0; font-weight:600; font-size:15px}
.lift .nm small{display:block; font-weight:400; color:var(--muted); font-size:13px}
.lift .val{font-family:var(--mono); font-size:15px; text-align:right; white-space:nowrap}
.lift svg{width:100px; height:32px; display:block}
@media (max-width:400px){.lift{grid-template-columns:1fr auto} .lift svg{grid-column:1 / -1; width:100%}}
.hist{display:grid; gap:8px}
.hitem{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.hitem summary{list-style:none; cursor:pointer; padding:12px 14px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center}
.hitem summary::-webkit-details-marker{display:none}
.hitem .meta{font-size:13px; color:var(--muted)}
.hbody{padding:0 14px 14px; display:grid; gap:6px; font-size:14px}
.hbody .ln{display:flex; justify-content:space-between; gap:12px; border-top:1px dashed var(--line); padding-top:6px}
.hbody .ln span:last-child{font-family:var(--mono); text-align:right}
.del{justify-self:end; margin-top:6px; background:none; border:1px solid var(--line); border-radius:8px; padding:6px 12px; color:var(--warn); font-weight:600}
.del[data-armed="1"]{background:var(--warn); border-color:var(--warn); color:#fff}
.empty{border:2px dashed var(--line-strong); border-radius:var(--r); padding:20px; text-align:center; color:var(--muted); display:grid; gap:6px}
.empty b{color:var(--ink)}
.plan-day ol{margin:0; padding-left:22px; display:grid; gap:4px}
.tips{margin:0; padding-left:20px; display:grid; gap:6px}

/* rest timer + toast */
.rest{position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px)); z-index:16; background:var(--ink); color:var(--bg)}
.rest .wrap{display:flex; align-items:center; gap:12px; padding-block:10px}
.rest .clock{font-family:var(--mono); font-size:26px; font-variant-numeric:tabular-nums; min-width:76px}
.rest .bar{flex:1; height:6px; border-radius:3px; background:color-mix(in srgb,var(--bg) 25%,transparent); overflow:hidden; min-width:30px}
.rest .bar i{display:block; height:100%; background:var(--day); width:100%}
.rest button{background:none; border:1px solid color-mix(in srgb,var(--bg) 40%,transparent); color:inherit; border-radius:8px; height:36px; padding:0 12px; font-weight:600}
.rest.over .clock{color:var(--day)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + 76px + env(safe-area-inset-bottom,0px)); z-index:30; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:600; font-size:15px; max-width:calc(100% - 32px); text-align:center}
@media (prefers-reduced-motion:no-preference){.rest .bar i{transition:width .9s linear}}
</style>
</head>
<body>

<main><div class="wrap" id="view"></div></main>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>Sleep</button>
    <button role="tab" id="tab-progress" data-tab="progress" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  </div>
</nav>

<script>
(() => {
/* ================= data ================= */
/* Exercise library. kind: weight | assist (machine help, lower is harder) | time (seconds) | reps (bodyweight count).
   eq: g machine or cable, d dumbbells, b barbell, w bodyweight. pat: the movement slot the coach fills.
   per: weight is per hand. side: count each side. adv: barbell lift the coach only gives experienced lifters. */
const EX = {
  legpress:{name:'Leg press', kind:'weight', step:10, eq:'g', pat:'squat', cue:'Feet shoulder-width on the platform. Lower until knees are near 90°, push through your heels.'},
  goblet:{name:'Goblet squat', kind:'weight', step:5, eq:'d', pat:'squat', cue:'Hold one dumbbell at your chest. Sit back and down, keep your chest up.'},
  bwsquat:{name:'Bodyweight squat', kind:'reps', eq:'w', pat:'squat', cue:'Feet shoulder-width. Sit back and down like into a chair, chest up, then stand tall.'},
  bbsquat:{name:'Barbell back squat', kind:'weight', step:5, eq:'b', pat:'squat', adv:true, cue:'Bar on your upper back, brace your core, squat to parallel with knees over toes. Set the safety bars.'},
  revlunge:{name:'Reverse lunge', kind:'weight', step:5, per:true, side:true, eq:'d', pat:'lunge', cue:'Step back and lower until both knees are near 90°, push through the front heel. Enter 0 for bodyweight.'},
  stepup:{name:'Step-up', kind:'weight', step:5, per:true, side:true, eq:'d', pat:'lunge', cue:'Whole foot on a sturdy box or bench, drive up through that heel, step down slowly. Enter 0 for bodyweight.'},
  legext:{name:'Leg extension', kind:'weight', step:5, eq:'g', pat:'quad', cue:'Pad on your lower shins. Straighten your legs, pause, lower slowly.'},
  wallsit:{name:'Wall sit', kind:'time', eq:'w', pat:'quad', cue:'Back flat on the wall, thighs level with the floor, knees over ankles.'},
  dbrdl:{name:'Dumbbell Romanian deadlift', kind:'weight', step:5, per:true, eq:'d', pat:'hinge', cue:'Soft knees, push your hips back and slide the dumbbells down your legs with a flat back. Squeeze your glutes to stand.'},
  bbrdl:{name:'Barbell Romanian deadlift', kind:'weight', step:10, eq:'b', pat:'hinge', adv:true, cue:'Bar close to your legs, hips back, flat back the whole way. Stop when you feel a stretch in your hamstrings.'},
  glutebridge:{name:'Glute bridge', kind:'weight', step:5, eq:'w', pat:'hinge', cue:'Feet flat, drive your hips up and squeeze at the top. Enter 0 for bodyweight.'},
  legcurl:{name:'Leg curl machine', kind:'weight', step:5, eq:'g', pat:'ham', cue:'Pad just above your heels. Curl slowly and control the way back.'},
  calfraise:{name:'Calf raise', kind:'weight', step:5, eq:'w', pat:'calf', cue:'Rise onto the balls of your feet, pause, lower all the way. Hold a dumbbell or enter 0 for bodyweight.'},
  chestpress:{name:'Chest press machine', kind:'weight', step:5, eq:'g', pat:'pushh', cue:'Handles at mid-chest. Press out smoothly and keep a slight bend in your elbows.'},
  dbbench:{name:'Dumbbell bench press', kind:'weight', step:5, per:true, eq:'d', pat:'pushh', cue:'Feet flat, lower the dumbbells to chest level, press up over your shoulders.'},
  inclinedb:{name:'Incline dumbbell press', kind:'weight', step:5, per:true, eq:'d', pat:'pushh', cue:'Bench on a low incline. Lower to chest level, press up over your shoulders.'},
  pushup:{name:'Push-up', kind:'reps', eq:'w', pat:'pushh', cue:'Hands under shoulders, body in one straight line. Hands on a bench or knees down makes it easier.'},
  bbbench:{name:'Barbell bench press', kind:'weight', step:5, eq:'b', pat:'pushh', adv:true, cue:'Eyes under the bar, feet flat, lower to mid-chest and press up. Always use a spotter or safety arms.'},
  dbpress:{name:'Seated dumbbell shoulder press', kind:'weight', step:5, per:true, eq:'d', pat:'pushv', cue:'Back flat on the bench. Press up until your arms are nearly straight, lower to ear level.'},
  pikepush:{name:'Pike push-up', kind:'reps', eq:'w', pat:'pushv', cue:'Hips high in an upside-down V. Bend your elbows to lower your head toward the floor, press back up.'},
  bbohp:{name:'Overhead press', kind:'weight', step:5, eq:'b', pat:'pushv', adv:true, cue:'Bar at your collarbones, squeeze your glutes, press straight up and bring your head through at the top.'},
  latraise:{name:'Lateral raise', kind:'weight', step:5, per:true, eq:'d', pat:'delt', cue:'Slight bend in the elbows, raise the dumbbells out to shoulder height, lower slowly. Go light.'},
  latpull:{name:'Lat pulldown', kind:'weight', step:5, eq:'g', pat:'pullv', cue:'Pull the bar to your upper chest and squeeze your shoulder blades down. No swinging.'},
  assistpull:{name:'Assisted pull-up', kind:'assist', step:10, eq:'g', pat:'pullv', cue:'The assist weight helps lift you, so a lower number is harder. Use lat pulldown if the machine is busy.'},
  cablerow:{name:'Seated cable row', kind:'weight', step:5, eq:'g', pat:'pullh', cue:'Sit tall, pull the handle to your belly, elbows close to your sides.'},
  dbrow:{name:'Dumbbell row', kind:'weight', step:5, per:true, eq:'d', pat:'pullh', cue:'One hand and knee on the bench. Pull the dumbbell to your hip.'},
  bbrow:{name:'Barbell row', kind:'weight', step:5, eq:'b', pat:'pullh', adv:true, cue:'Hinge forward with a flat back, pull the bar to your lower ribs, lower with control.'},
  superman:{name:'Superman hold', kind:'time', eq:'w', pat:'pullh', cue:'Lie face down, lift your arms, chest and legs a few inches and hold. Keep your neck long.'},
  facepull:{name:'Cable face pull', kind:'weight', step:5, eq:'g', pat:'rear', cue:'Rope at face height, pull toward your forehead with elbows high, squeeze your upper back.'},
  ytraise:{name:'Prone Y-T raise', kind:'reps', eq:'w', pat:'rear', cue:'Lie face down, thumbs up. Lift your arms into a Y, then a T, squeezing your shoulder blades. Slow and small.'},
  dbcurl:{name:'Dumbbell curl', kind:'weight', step:5, per:true, eq:'d', pat:'bi', cue:'Elbows pinned to your sides, curl up, lower slowly. No swinging.'},
  pushdown:{name:'Triceps pushdown', kind:'weight', step:5, eq:'g', pat:'tri', cue:'Elbows at your sides, push down until your arms are straight, control it back up.'},
  dbext:{name:'Overhead triceps extension', kind:'weight', step:5, eq:'d', pat:'tri', cue:'Hold one dumbbell overhead with both hands, lower it behind your head, straighten your arms.'},
  plank:{name:'Plank', kind:'time', eq:'w', pat:'core', cue:'Straight line from head to heels, squeeze your glutes. Drop to your knees if your hips sag.'},
  sideplank:{name:'Side plank', kind:'time', side:true, eq:'w', pat:'core', cue:'Elbow under shoulder, body straight from head to feet. Drop the bottom knee to make it easier.'},
  deadbug:{name:'Dead bug', kind:'reps', side:true, eq:'w', pat:'core', cue:'On your back, arms up, knees bent at 90°. Lower the opposite arm and leg slowly, lower back flat on the floor.'},
  bicycle:{name:'Bicycle crunches', kind:'reps', side:true, eq:'w', pat:'core', cue:'Slow and controlled, elbow toward the opposite knee. Count each side.'}
};
const PATS = {squat:'Legs', lunge:'Legs', quad:'Legs', hinge:'Legs', ham:'Legs', calf:'Legs', pushh:'Push', pushv:'Push', pullv:'Pull', pullh:'Pull', rear:'Pull', delt:'Shoulders and arms', bi:'Shoulders and arms', tri:'Shoulders and arms', core:'Core'};
const EQ_NAMES = {g:'Machine', d:'Dumbbells', b:'Barbell', w:'Bodyweight'};
const KINDS = {weight:'Weights', assist:'Assisted machine', time:'Timed hold', reps:'Bodyweight reps'};
const EXP_TEXT = {new:'New to lifting', some:'Some experience (under a year)', exp:'Experienced (1+ years)'};
const GOAL_TEXT = {fitness:'Get fitter', strength:'Get stronger', muscle:'Build muscle', sport:'Sport performance'};
const EQUIP_TEXT = {gym:'Full gym', dumbbells:'Dumbbells only', home:'No equipment (home)'};
const LETTERS = 'ABCDEF';
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const defTarget = kind => kind === 'time' ? {sets:3, lo:20, hi:30} : kind === 'reps' ? {sets:3, lo:10, hi:15} : {sets:3, lo:10, hi:12};
const item = (id, t) => Object.assign({id}, defTarget(EX[id].kind), t);
/* the starting plan: the original Mon/Wed/Fri 4:30–6:30 full-body rotation */
const DEF_PLAN = () => ({
  days:[1,3,5], start:'16:30', length:120, cardio:30,
  workouts:[
    {id:'A', name:'Full Body A', ex:[item('legpress'), item('chestpress'), item('latpull'), item('dbpress'), item('plank')]},
    {id:'B', name:'Full Body B', ex:[item('goblet'), item('cablerow'), item('inclinedb'), item('legcurl'), item('glutebridge')]},
    {id:'C', name:'Full Body C', ex:[item('legpress'), item('assistpull'), item('chestpress'), item('dbrow'), item('bicycle', {lo:15, hi:15})]}
  ],
  custom:{}, profile:{age:'', weight:'', exp:'new', goal:'fitness', equip:'gym'}
});

/* meal keys: b breakfast, l lunch, s afternoon / pre-gym snack, d dinner. p = rough grams of protein per portion */
const FOODS = [
  {id:'eggs', name:'Eggs', g:'protein', por:'2–3 eggs', p:15, m:'bl'},
  {id:'yogurt', name:'Greek yogurt', g:'protein', por:'1 cup', p:17, m:'bs'},
  {id:'chicken', name:'Chicken breast', g:'protein', por:'1 palm', p:28, m:'ld'},
  {id:'turkey', name:'Ground turkey', g:'protein', por:'1 palm', p:22, m:'ld'},
  {id:'beef', name:'Lean ground beef', g:'protein', por:'1 palm', p:22, m:'ld'},
  {id:'fish', name:'Salmon or white fish', g:'protein', por:'1 palm', p:24, m:'d'},
  {id:'tuna', name:'Tuna', g:'protein', por:'1 can', p:25, m:'l'},
  {id:'deli', name:'Deli turkey', g:'protein', por:'4 slices', p:10, m:'ls'},
  {id:'beans', name:'Black beans', g:'protein', por:'½ cup', p:7, m:'ld'},
  {id:'cheese', name:'String cheese', g:'protein', por:'1–2 sticks', p:7, m:'s'},
  {id:'milk', name:'Milk', g:'protein', por:'1 cup', p:8, m:'bs'},
  {id:'pb', name:'Peanut butter', g:'protein', por:'1 thumb', p:4, m:'bs'},
  {id:'oats', name:'Oatmeal', g:'carb', por:'1 cupped hand, dry', p:5, m:'b'},
  {id:'toast', name:'Whole-wheat toast', g:'carb', por:'1–2 slices', p:4, m:'bls'},
  {id:'muffin', name:'English muffin', g:'carb', por:'1', p:5, m:'bs'},
  {id:'cereal', name:'Low-sugar cereal', g:'carb', por:'1 cupped hand', p:3, m:'b'},
  {id:'rice', name:'Rice', g:'carb', por:'1 cupped hand', p:2, m:'ld'},
  {id:'potato', name:'Potato', g:'carb', por:'1 fist', p:3, m:'ld'},
  {id:'tortilla', name:'Tortilla', g:'carb', por:'1–2', p:4, m:'bld'},
  {id:'pasta', name:'Pasta', g:'carb', por:'1 cupped hand', p:6, m:'ld'},
  {id:'crackers', name:'Whole-grain crackers', g:'carb', por:'1 cupped hand', p:2, m:'s'},
  {id:'granola', name:'Granola bar', g:'carb', por:'1 bar', p:3, m:'s'},
  {id:'banana', name:'Banana', g:'produce', por:'1', p:1, m:'bs'},
  {id:'apple', name:'Apple', g:'produce', por:'1', p:0, m:'ls'},
  {id:'berries', name:'Berries', g:'produce', por:'1 fist', p:1, m:'bs'},
  {id:'broccoli', name:'Broccoli', g:'produce', por:'1–2 fists', p:3, m:'ld'},
  {id:'salad', name:'Salad greens', g:'produce', por:'2 fists', p:1, m:'ld'},
  {id:'carrots', name:'Baby carrots', g:'produce', por:'1 fist', p:1, m:'ls'},
  {id:'greenbeans', name:'Green beans', g:'produce', por:'1–2 fists', p:2, m:'d'},
  {id:'peppers', name:'Peppers and onions', g:'produce', por:'1 fist', p:1, m:'bld'}
];
const GROUPS = {protein:'Protein', carb:'Carbs', produce:'Fruit and veg'};
const SWAPS = [
  ['Soda or energy drink','Water or sparkling water'],
  ['Chips','Popcorn or crackers + cheese'],
  ['Candy bar','Fruit + peanut butter'],
  ['Fast-food fries','A side salad or fruit cup'],
  ['Sugary cereal','Oatmeal with banana']
];

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtDate = s => parseYmd(s).toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
const toMin = hm => { const [h,m] = String(hm||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const fmt12 = mins => { mins = ((mins % 1440) + 1440) % 1440; const h = Math.floor(mins/60), m = mins%60; return `${h%12||12}:${pad(m)} ${h<12?'AM':'PM'}`; };
const fmtDur = mins => `${Math.floor(mins/60)}h ${pad(mins%60)}m`;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };
const clampN = (v, lo, hi, d) => { const n = Math.round(Number(v)); return v === '' || v == null || isNaN(n) ? d : Math.min(hi, Math.max(lo, n)); };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 20);
const newId = p => p + Math.random().toString(36).slice(2, 8);
const pruneKeys = (obj, keep) => { const ks = Object.keys(obj||{}).sort(); const out = {}; ks.slice(-keep).forEach(k => out[k] = obj[k]); return out; };

/* ================= storage ================= */
/* Everything lives in this browser's localStorage under liftling.* keys. Settings exports and imports a JSON backup. */
const DEF_SLEEP = () => ({wake:'06:45', goal:9, nights:{}});
const DEF_FOOD = () => ({skip:[], days:{}});
const store = {ok:true, sessions:[], sleep:DEF_SLEEP(), food:DEF_FOOD(), plan:DEF_PLAN()};
function setSync(mode, text){ $('#sync').dataset.state = mode; $('#syncText').textContent = text; }
function storageWorks(){ try { localStorage.setItem('liftling.test','1'); localStorage.removeItem('liftling.test'); return true; } catch(e){ return false; } }
function loadStore(){
  store.sessions = (lsGet('liftling.sessions') || []).sort((a,b)=>b.ts-a.ts);
  store.sleep = Object.assign(DEF_SLEEP(), lsGet('liftling.sleep') || {});
  store.food = Object.assign(DEF_FOOD(), lsGet('liftling.food') || {});
  store.plan = cleanPlan(lsGet('liftling.plan')) || DEF_PLAN();
}
/* Liftling was called Iron Log, then Plates: carry over anything saved under the old ironlog.* or plates.* keys */
function migrateOldKeys(){
  try {
    Object.keys(localStorage).filter(k => /^(ironlog|plates)\./.test(k)).forEach(k => {
      const nk = 'liftling.' + k.slice(k.indexOf('.') + 1);
      if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(k));
      localStorage.removeItem(k);
    });
  } catch(e){}
}
function initStore(){
  store.ok = storageWorks();
  if (store.ok) migrateOldKeys();
  loadStore();
  if (store.ok) setSync('local', 'Saved on this device');
  else setSync('off', 'Can’t save in this browser');
}
let saveWarned = false;
function persist(k, v){
  const ok = lsSet('liftling.'+k, v);
  if (ok) saveWarned = false;
  else if (!saveWarned) { saveWarned = true; toast('Couldn’t save. Browser storage is full or turned off. Export a backup in Settings.'); }
  return ok;
}
function saveDoc(k, obj){ store[k] = obj; return persist(k, obj); }
function saveSession(s){
  store.sessions = store.sessions.filter(x => x.id !== s.id).concat(s).sort((a,b)=>b.ts-a.ts);
  return persist('sessions', store.sessions);
}
function deleteSession(id){
  store.sessions = store.sessions.filter(x => x.id !== id);
  persist('sessions', store.sessions);
  render();
}
/* another tab of Liftling saved something: pick it up, like the old live sync did */
window.addEventListener('storage', e => {
  if (e.key && (!e.key.startsWith('liftling.') || e.key === 'liftling.draft')) return;
  loadStore(); refreshDraft();
  if (state.tab !== 'workout' || !state.touched) softRender();
});

/* ================= plan ================= */
/* The plan is the person's own: gym days, session time, 1–6 workouts and their exercises, custom exercises,
   and the profile the coach uses. Saved as liftling.plan and included in backups. */
const exInfo = id => EX[id] || store.plan.custom[id] || {name:id, kind:'weight', step:5, cue:''};
const workoutById = id => store.plan.workouts.find(w => w.id === id);
const letterOf = id => { const i = store.plan.workouts.findIndex(w => w.id === id); return i < 0 ? 'X' : LETTERS[i]; };
const itemFor = (wid, exId) => ((workoutById(wid) || {}).ex || []).find(x => x.id === exId) || Object.assign({id:exId}, defTarget(exInfo(exId).kind));
const range = it => it.lo === it.hi ? `${it.hi}` : `${it.lo}–${it.hi}`;
const tgtText = (it, ex) => `${it.sets}×${range(it)}${ex.kind === 'time' ? 's' : ''}${ex.side ? '/side' : ''}`;
function cleanItem(it, kind){
  const d = defTarget(kind), lo = clampN(it.lo, 1, 600, d.lo);
  const out = {id:it.id, sets:clampN(it.sets, 1, 8, d.sets), lo, hi:clampN(it.hi, lo, 600, Math.max(lo, d.hi))};
  const st = Number(it.start);
  if ((kind === 'weight' || kind === 'assist') && it.start !== '' && it.start != null && st >= 0 && st <= 1000) out.start = Math.round(st);
  return out;
}
function cleanProfile(p){
  p = p || {};
  return {age:clampN(p.age, 8, 99, ''), weight:clampN(p.weight, 40, 700, ''),
    exp: EXP_TEXT[p.exp] ? p.exp : 'new', goal: GOAL_TEXT[p.goal] ? p.goal : 'fitness', equip: EQUIP_TEXT[p.equip] ? p.equip : 'gym'};
}
/* plans come from storage, backup files and AI answers: keep only well-formed parts */
function cleanPlan(o){
  if (!o || typeof o !== 'object' || !Array.isArray(o.workouts)) return null;
  const custom = {};
  Object.entries(o.custom && typeof o.custom === 'object' ? o.custom : {}).forEach(([id, c]) => {
    if (/^cx_[a-z0-9_]{1,40}$/.test(id) && c && typeof c.name === 'string' && c.name.trim() && KINDS[c.kind])
      custom[id] = {name:c.name.trim().slice(0, 40), kind:c.kind, cue: typeof c.cue === 'string' ? c.cue.slice(0, 300) : ''};
  });
  const known = id => typeof id === 'string' && (EX[id] || custom[id]), ids = new Set();
  const workouts = o.workouts.filter(w => w && typeof w === 'object').slice(0, 6).map((w, i) => {
    let id = typeof w.id === 'string' && /^[\w-]{1,20}$/.test(w.id) && !ids.has(w.id) ? w.id : newId('w');
    ids.add(id);
    const seen = new Set();
    const ex = (Array.isArray(w.ex) ? w.ex : []).filter(it => it && known(it.id) && !seen.has(it.id) && seen.add(it.id)).slice(0, 12).map(it => cleanItem(it, known(it.id).kind));
    return {id, name:(typeof w.name === 'string' && w.name.trim() ? w.name.trim() : 'Workout ' + LETTERS[i]).slice(0, 40), ex};
  });
  if (!workouts.length) return null;
  const days = Array.isArray(o.days) ? [...new Set(o.days.map(Number).filter(d => Number.isInteger(d) && d >= 0 && d <= 6))].sort((a,b) => a-b) : [];
  return {days: days.length ? days : [1,3,5], start: isHm(o.start) ? o.start : '16:30', length:clampN(o.length, 30, 240, 120), cardio:clampN(o.cardio, 0, 60, 30),
    workouts, custom, profile:cleanProfile(o.profile)};
}

const isGymDay = d => store.plan.days.includes(d.getDay());
const daysText = () => WEEK_ORDER.filter(d => store.plan.days.includes(d)).map(d => DOW[d]).join(' · ');
function nextWorkout(){
  const W = store.plan.workouts, last = store.sessions.find(s => W.some(w => w.id === s.day));
  return last ? W[(W.findIndex(w => w.id === last.day) + 1) % W.length].id : W[0].id;
}
function nextGymDay(){
  const now = new Date(), trained = store.sessions.some(s => s.date === ymd(now));
  for (let i = trained ? 1 : 0; i < 8; i++){ const d = new Date(now); d.setDate(d.getDate() + i); if (isGymDay(d)) return {d, today: i === 0}; }
  return {d:now, today:false};
}
function phases(){
  const p = store.plan, s = toMin(p.start), len = p.length;
  const warm = len >= 75 ? 15 : 10, stretch = len >= 75 ? 15 : 10;
  const cardio = Math.max(0, Math.min(p.cardio, len - warm - stretch - 20));
  const list = [{m:s, ph:'Warm-up'}, {m:s + warm, ph:'Strength'}];
  if (cardio) list.push({m:s + len - stretch - cardio, ph:'Cardio'});
  list.push({m:s + len - stretch, ph:'Stretch'});
  return {list, start:s, end:s + len, warm, stretch, cardio};
}
const fmtShort = mins => { mins = ((mins % 1440) + 1440) % 1440; return `${Math.floor(mins/60) % 12 || 12}:${pad(mins % 60)}`; };
const isAm = mins => ((mins % 1440) + 1440) % 1440 < 720;
const timeRange = () => { const {start, end} = phases(); return isAm(start) === isAm(end) ? `${fmtShort(start)}–${fmt12(end)}` : `${fmt12(start)}–${fmt12(end)}`; };
function currentPhase(live){
  const now = new Date();
  if (!live || !isGymDay(now)) return -1;
  const {list, end} = phases(), m = now.getHours()*60 + now.getMinutes();
  if (m < list[0].m || m >= end) return -1;
  let idx = 0; list.forEach((p,i) => { if (m >= p.m) idx = i; });
  return idx;
}

/* ================= workout logic ================= */
const filled = x => x.r !== '' && x.r != null;
function lastEntry(exId){
  for (const s of store.sessions){ const e = (s.entries||[]).find(e => e.ex === exId); if (e && e.sets && e.sets.some(filled)) return {s, e}; }
  return null;
}
/* it: the exercise's plan entry {id, sets, lo, hi, start?}. Suggest the next step once every set reached the top of the range. */
function suggest(it){
  const ex = exInfo(it.id), L = lastEntry(it.id), step = ex.step || 5;
  if (!L) return it.start != null
    ? {w:it.start, last:null, up:`Suggested start: ${it.start} lb${ex.kind === 'assist' ? ' of assist' : ex.per ? ' each' : ''}`}
    : {w:'', last:null, up:null};
  const sets = L.e.sets.filter(filled);
  const ws = sets.map(x => Number(x.w)).filter(n => !isNaN(n));
  const top = ws.length ? (ex.kind === 'assist' ? Math.min(...ws) : Math.max(...ws)) : '';
  const reps = sets.map(x => Number(x.r));
  const last = 'Last ' + fmtDate(L.s.date) + ': ' + sets.map(x => ex.kind === 'time' ? `${x.r}s` : ex.kind === 'reps' ? `${x.r}` : `${x.w}×${x.r}`).join(', ');
  let w = top, up = null;
  const allHit = sets.length >= it.sets && reps.every(r => r >= it.hi);
  if (ex.kind === 'weight' && allHit) { w = Number(top) + step; up = `Try ${w} lb${ex.per?' each':''} today`; }
  else if (ex.kind === 'assist' && allHit) { w = Math.max(0, Number(top) - step); up = `Try ${w} lb of assist today`; }
  else if (ex.kind === 'time' && sets.length >= it.sets) { const mn = Math.min(...reps); if (mn >= it.lo) up = `Aim for ${Math.min(Math.max(60, it.hi), Math.max(...reps)+5)}s holds`; }
  return {w: (ex.kind === 'time' || ex.kind === 'reps') ? '' : w, last, up};
}

function recPreview(rec){

/* ---------- food ---------- */
function defaultMeal(){
  const m = new Date().getHours()*60 + new Date().getMinutes();
  return m < 630 ? 'b' : m < 870 ? 'l' : m < 1000 ? 's' : 'd';
}
/* on gym days the meal around the session shifts with the gym time: morning, midday or afternoon/evening */
function mealsFor(date){
  const gym = isGymDay(date), {start, end} = phases(), when = gym ? (start < 660 ? 'am' : start < 840 ? 'mid' : 'pm') : '';
  const recover = 'Protein helps your muscles recover';
  return [
    when === 'am' ? {k:'b', name:'Pre-gym breakfast', when:`~${fmt12(start - 45)}`, tip:'Something light, like toast or a banana. Eat more after training.'}
      : {k:'b', name:'Breakfast', when:'Morning', tip:'Within an hour or two of waking'},
    when === 'am' ? {k:'l', name:'Lunch', when:'Midday', tip:recover}
      : when === 'mid' ? {k:'l', name:'Lunch', when:`After gym, ~${fmt12(end + 15)}`, tip:recover}
      : {k:'l', name:'Lunch', when:'Midday', tip:'Protein, carbs and a fruit or veg'},
    when === 'pm' ? {k:'s', name:'Pre-gym snack', when:`${fmtShort(start - 60)}–${fmt12(start - 30)}`, tip:`Something light so you have energy at ${fmt12(start)}`}
      : when === 'mid' ? {k:'s', name:'Pre-gym snack', when:`~${fmt12(start - 45)}`, tip:'Something light so you have energy to train'}
      : {k:'s', name:'Afternoon snack', when:'Afternoon', tip:'Small, to hold you to dinner'},
    when === 'pm' ? {k:'d', name:'Dinner', when:`After gym, ~${fmt12(end + 30)}`, tip:recover}
      : {k:'d', name:'Dinner', when:'Evening', tip:'Balanced plate'}
  ];
}
function foodDay(){
  const k = ymd(new Date()); const f = store.food;
  const d = (f.days && f.days[k]) || {meals:{}, water:0};
  return {k, d};
}
function mealOptions(meal){
  const skip = new Set(store.food.skip || []);
  const pool = g => { const all = FOODS.filter(f => f.g === g && f.m.includes(meal)); const ok = all.filter(f => !skip.has(f.id)); return ok.length ? ok : null; };
  let P = pool('protein'), C = pool('carb'), V = pool('produce');
  const missing = [];
  if (!P) { missing.push('protein'); P = FOODS.filter(f=>f.g==='protein'&&f.m.includes(meal)); }
  if (!C) { missing.push('carbs'); C = FOODS.filter(f=>f.g==='carb'&&f.m.includes(meal)); }
  if (!V) { missing.push('fruit or veg'); V = FOODS.filter(f=>f.g==='produce'&&f.m.includes(meal)); }
  const out = [], seen = new Set();
  for (let t = 0; out.length < 3 && t < 40; t++) {
    const s = state.seed * 3 + t;
    const p = P[(s * 7 + 3) % P.length], c = C[(s * 5 + 1) % C.length], v = V[(s * 3 + 2) % V.length];
    const items = meal === 's' ? [p, (t % 2 ? v : c)] : [p, c, v];
    const key = items.map(x=>x.id).join('+');
    if (seen.has(key)) continue; seen.add(key);
    out.push({items, protein: items.reduce((a,x)=>a+x.p,0)});
  }
  return {out, missing};
}
function foodView(){

    <section class="card tight" aria-label="Meals today">

      <p class="muted small">Tap a glass to fill up to it. Drink extra on gym days.</p>
    </section>

      <p class="muted small">${esc(mInfo.name)}: ${esc(mInfo.tip.toLowerCase())}. Built from foods you like, sized with your hand.</p>
      ${out.map((o,i) => `<div class="opt">
        <div class="opt-top"><b>Option ${i+1}</b><span class="num">about ${o.protein} g protein</span></div>

      <div class="legend" aria-label="Hand portion guide">
        <div><b>Palm</b><span>protein</span></div><div><b>Fist</b><span>veggies</span></div><div><b>Cupped hand</b><span>carbs</span></div><div><b>Thumb</b><span>fats</span></div>
      </div>

      </details>

    <section class="card tight"><div class="swaps">${SWAPS.map(([a,b])=>`<div><span class="muted">${esc(a)}</span><span class="arr">→</span><span>${esc(b)}</span></div>`).join('')}</div></section>
    <p class="note">This tab doesn’t count calories. If you want calorie or weight goals, get them from your doctor or a dietitian so they’re right for you.</p>`;

/* ---------- sleep ---------- */
function sleepPlan(){
  const s = store.sleep, wake = toMin(s.wake), goal = Number(s.goal)||9;
  const lights = wake - goal*60 - 15;
  return {wake, goal, lights, phone: lights - 30, wind: lights - 60};
}
function gymSleepTip(p){
  const end = phases().end % 1440, lights = p.lights < 720 ? p.lights + 1440 : p.lights;
  if (end < 840) return 'Gym days help you sleep deeper. Training early? Keep lights out on time so you’re rested for it.';
  return lights - end >= 120
    ? `Gym days help you sleep deeper, and finishing by ${fmt12(end)} leaves plenty of time to wind down.`
    : `Training ends close to lights out, so keep the stretch calm and dim the lights straight after.`;
}
function nightsLast7(){
  const out = []; const n = store.sleep.nights || {};
  for (let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); const k = ymd(d); const r = n[k]; out.push({k, d, mins: r ? durOf(r.bed, r.wake) : null}); }
  return out;
}
function durOf(bed, wake){ let m = toMin(wake) - toMin(bed); if (m <= 0) m += 1440; return m; }
function sleepChart(rows, goal){
  const W = 320, H = 150, L = 26, R = 6, T = 18, B = 22, ih = H - T - B, iw = W - L - R;
  const maxH = 12, y = h => T + ih - (h/maxH)*ih, bw = iw/7*0.56;
  let g = '';
  [0,4,8,12].forEach(h => { g += `<line x1="${L}" x2="${W-R}" y1="${y(h)}" y2="${y(h)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(h)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${h}</text>`; });
  rows.forEach((r,i) => {
    const cx = L + iw/7*(i+.5);
    const lbl = r.d.toLocaleDateString(undefined,{weekday:'narrow'});
    g += `<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Barlow, sans-serif">${lbl}</text>`;
    if (r.mins != null) {
      const h = Math.min(maxH, r.mins/60), top = y(h);
      g += `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${y(0)-top}" rx="4" fill="var(--night)" fill-opacity="${r.mins/60 >= goal ? 1 : .45}"/>`;
      g += `<text x="${cx}" y="${top-5}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${(r.mins/60).toFixed(1)}</text>`;
    }
  });
  g += `<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-R}" y="${y(goal)-5}" text-anchor="end" font-size="10" fill="var(--ink)" font-family="Barlow, sans-serif">goal ${goal}h</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours slept, last 7 nights">${g}</svg>`;
}
function sleepView(){

    <section class="card">

        <div><span class="label" style="display:block;margin-bottom:6px">Sleep goal</span>
          <div class="seg" role="group" aria-label="Sleep goal">${[8,9,10].map(h=>`<button type="button" data-goal="${h}" aria-pressed="${Number(s.goal)===h}">${h}h</button>`).join('')}</div></div>
      </div>
      <div><span class="label">Lights out by</span><div class="bigtime num">${fmt12(p.lights)}</div><p class="muted small">Includes about 15 minutes to fall asleep.</p></div>
      <div class="steps">
        <div><span class="num">${fmt12(p.wind)}</span><span>Wind down: finish homework and gaming, dim the lights</span></div>
        <div><span class="num">${fmt12(p.phone)}</span><span>Phone on the charger, away from the bed</span></div>
        <div><span class="num">${fmt12(p.lights)}</span><span>Lights out</span></div>
        <div><span class="num">${fmt12(p.wake)}</span><span>Wake up, ${p.goal} hours later</span></div>

    <div class="sect"><h4>Last night</h4></div>
    <section class="card">
      <div class="row2" style="grid-template-columns:1fr 1fr">
        <label class="field"><span class="label" style="display:block;margin-bottom:6px">Went to sleep</span><input type="time" id="bedLog" data-log="bed" value="${esc(draftBed)}"></label>
        <label class="field"><span class="label" style="display:block;margin-bottom:6px">Woke up</span><input type="time" id="wakeLog" data-log="wake" value="${esc(draftWake)}"></label>

    <section class="card chart">

        <li>Keep the room cool and dark.</li>

/* ---------- progress ---------- */
function weekStart(d){ const x = new Date(d); const off = (x.getDay()+6)%7; x.setDate(x.getDate()-off); x.setHours(0,0,0,0); return x; }
function topOf(e, kind){
  const ws = e.sets.filter(filled); if (!ws.length) return null;
  if (kind === 'time' || kind === 'reps') return Math.max(...ws.map(s=>Number(s.r)||0));
  const nums = ws.map(s=>Number(s.w)).filter(n=>!isNaN(n)); if (!nums.length) return null;
  return kind === 'assist' ? Math.min(...nums) : Math.max(...nums);
}
function spark(vals){
  const W=100,H=32,p=4;
  if (vals.length < 2) return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><circle cx="${W-p}" cy="${H/2}" r="3.5" fill="var(--plate-a)"/></svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn)||1;
  const pts = vals.map((v,i)=>[p + i*(W-2*p)/(vals.length-1), H-p - (v-mn)/rg*(H-2*p)]);
  const line = pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><polygon points="${p},${H-p} ${line} ${W-p},${H-p}" fill="var(--plate-a)" fill-opacity=".14"/><polyline points="${line}" fill="none" stroke="var(--plate-a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="var(--plate-a)"/></svg>`;
}
function progressView(){
  const S = store.sessions, now = new Date(), ws = weekStart(now);
  const days = [...Array(7)].map((_,i)=>{ const d = new Date(ws); d.setDate(d.getDate()+i); return d; });
  const thisWeek = S.filter(s => parseYmd(s.date) >= ws);
  const doneDates = new Set(thisWeek.map(s=>s.date));
  const cardioWk = thisWeek.reduce((a,s)=>a+(Number(s.cardio && s.cardio.min)||0),0);
  const nights = nightsLast7().filter(r=>r.mins!=null);
  const avgSleep = nights.length ? (nights.reduce((a,r)=>a+r.mins,0)/nights.length/60).toFixed(1) : '–';
  const week = `<section class="card"><div class="week">${days.map(d=>{
    const k = ymd(d), cls = [doneDates.has(k)?'done':'', isGymDay(d)?'sched':'', k===ymd(now)?'is-today':''].join(' ');
    return `<div class="d ${cls}"><span class="dot"></span><span>${d.toLocaleDateString(undefined,{weekday:'narrow'})}</span></div>`; }).join('')}</div></section>`;
  const stats = `<div class="stats">
    <div class="stat"><div class="v num">${thisWeek.length}<small>/${store.plan.days.length}</small></div><div class="k">Workouts this week</div></div>
    <div class="stat"><div class="v num">${cardioWk}</div><div class="k">Cardio minutes</div></div>
    <div class="stat"><div class="v num">${avgSleep}<small>h</small></div><div class="k">Avg sleep, 7 nights</div></div></div>`;
  const head = `<div class="hero"><span class="eyebrow">Week of ${ws.toLocaleDateString(undefined,{month:'short', day:'numeric'})}</span><h2>Progress</h2></div>`;
  if (!S.length) {
    return `${head}${week}${stats}<div class="empty"><b>No workouts saved yet</b><span>Log your first session on the Workout tab. Your weights will show up here so you can watch them climb.</span></div>`;
  }
  const asc = [...S].sort((a,b)=>a.ts-b.ts);
  /* every exercise ever logged, including custom ones; entries carry their name in case it left the plan */
  const logged = {};
  asc.forEach(s => (s.entries||[]).forEach(e => { if (!(e.ex in logged)) logged[e.ex] = e.nm; }));
  const liftRows = Object.keys(logged).map(id => {
    const ex = EX[id] || store.plan.custom[id] || {name:logged[id] || id, kind:'weight'}, series = [];
    asc.forEach(s => { const e = (s.entries||[]).find(e=>e.ex===id); if (e){ const t = topOf(e, ex.kind); if (t!=null) series.push(t); } });
    if (!series.length) return '';
    const last = series[series.length-1], first = series[0];
    const unit = ex.kind==='time'?'s':ex.kind==='reps'?' reps':' lb';
    const delta = ex.kind==='assist' ? first-last : last-first;
    const sub = series.length > 1 ? (delta > 0 ? `${ex.kind==='assist'?'Down':'Up'} ${Math.abs(delta)}${unit} since your first log` : `${series.length} sessions logged`) : 'First log';
    return `<div class="lift"><div class="nm">${esc(ex.name)}<small>${sub}</small></div><div class="val">${last}${unit}</div>${spark((ex.kind==='assist'?series.map(v=>-v):series).slice(-12))}</div>`;
  }).filter(Boolean).join('');
  const hist = S.map(s => {
    const sets = (s.entries||[]).reduce((a,e)=>a+e.sets.filter(filled).length,0);
    const lines = (s.entries||[]).filter(e=>e.sets.some(filled)).map(e => {
      const ex = EX[e.ex] || store.plan.custom[e.ex] || {name:e.nm || e.ex, kind:'weight'};
      const t = e.sets.filter(filled).map(x => ex.kind==='time'?`${x.r}s`:ex.kind==='reps'?x.r:`${x.w||0}×${x.r}`).join(', ');
      return `<div class="ln"><span>${esc(ex.name)}</span><span>${esc(t)}</span></div>`;
    }).join('');
    const L = letterOf(s.day), wname = (workoutById(s.day) || {}).name || s.wname || 'Workout';
    return `<details class="hitem"><summary><span class="disc" data-d="${L}">${L === 'X' ? '•' : L}</span>
      <span><b style="font-weight:600">${esc(fmtDate(s.date))}</b> <span class="meta">· ${esc(wname)}</span><br><span class="meta">${plural(sets, 'set')} · ${Number(s.cardio&&s.cardio.min)||0} min cardio</span></span><span class="muted" aria-hidden="true">▾</span></summary>
      <div class="hbody">${lines || '<span class="muted">No sets logged.</span>'}
        ${s.cardio && s.cardio.min ? `<div class="ln"><span>${esc(s.cardio.type)}</span><span>${esc(s.cardio.min)} min</span></div>`:''}
        ${s.notes ? `<p class="muted" style="padding-top:6px">${esc(s.notes)}</p>`:''}
        <button type="button" class="del" data-del="${esc(s.id)}">Delete</button></div></details>`;
  }).join('');
  return `${head}${week}${stats}
    <div class="sect"><h4>Lifts</h4></div><section class="card tight">${liftRows || '<p class="muted" style="padding:12px 0">Log sets with reps to see your lifts here.</p>'}</section>
    <div class="sect"><h4>History</h4><span class="muted small">${S.length} workout${S.length===1?'':'s'}</span></div><div class="hist">${hist}</div>`;
}

/* ---------- settings: backup ---------- */
const BACKUP_FORMAT = 2;
const isYmd = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseYmd(s));
const isHm = s => typeof s === 'string' && /^\d{1,2}:\d{2}$/.test(s);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const shortDate = d => d.toLocaleDateString(undefined,{month:'short', day:'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric'});
function exportData(){
  const now = new Date();
  const data = {app:'Liftling', format:BACKUP_FORMAT, exported:now.toISOString(), sessions:store.sessions, sleep:store.sleep, food:store.food, plan:store.plan};
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = `liftling-backup-${ymd(now)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  lsSet('liftling.lastExport', now.getTime());
  toast('Backup downloaded'); softRender();
}
/* a backup file is outside data: keep only well-formed records so a bad file can't break the views */
function cleanSession(s){
  if (!s || typeof s !== 'object' || typeof s.id !== 'string' || !s.id || typeof s.day !== 'string' || !/^[\w-]{1,20}$/.test(s.day) || !isYmd(s.date) || !Array.isArray(s.entries)) return null;
  const entries = s.entries
    .filter(e => e && typeof e.ex === 'string' && Array.isArray(e.sets))
    .map(e => ({ex:e.ex.slice(0,60), nm: typeof e.nm === 'string' ? e.nm.slice(0,40) : undefined, sets:e.sets.filter(x => x && filled(x) && !isNaN(Number(x.r))).map(x => ({w:String(x.w ?? '').replace(/[^0-9.]/g,''), r:Number(x.r)}))}))
    .filter(e => e.sets.length);
  const c = s.cardio || {};
  return {id:s.id.slice(0,60), day:s.day, wname: typeof s.wname === 'string' ? s.wname.slice(0,40) : undefined, date:s.date, ts:Number(s.ts) || parseYmd(s.date).getTime(),
    warm:!!s.warm, stretch:!!s.stretch, notes: typeof s.notes === 'string' ? s.notes : '',

function readBackup(text){
  let o; try { o = JSON.parse(text); } catch(e){ throw new Error('That file isn’t a valid backup. Pick the .json file Liftling exported.'); }
  if (!o || !['Liftling', 'Plates', 'Iron Log'].includes(o.app)) throw new Error('That file isn’t a Liftling backup.');
  if (Number(o.format) > BACKUP_FORMAT) throw new Error('That backup is from a newer version of Liftling.');
  const sl = o.sleep || {}, fd = o.food || {}, nights = {}, days = {}, foodIds = new Set(FOODS.map(f => f.id));
  Object.entries(sl.nights || {}).forEach(([k,v]) => { if (isYmd(k) && v && isHm(v.bed) && isHm(v.wake)) nights[k] = {bed:v.bed, wake:v.wake}; });
  Object.entries(fd.days || {}).forEach(([k,v]) => {
    if (!isYmd(k) || !v) return;
    const m = v.meals || {};
    days[k] = {meals:{b:!!m.b, l:!!m.l, s:!!m.s, d:!!m.d}, water:Math.max(0, Math.min(8, Math.round(Number(v.water) || 0)))};
  });
  const exported = new Date(o.exported);
  return {
    exported: isNaN(exported) ? null : exported,
    sessions: (Array.isArray(o.sessions) ? o.sessions : []).map(cleanSession).filter(Boolean),
    nights, days,
    wake: isHm(sl.wake) ? sl.wake : null,
    goal: [8,9,10].includes(Number(sl.goal)) ? Number(sl.goal) : null,
    skip: Array.isArray(fd.skip) ? fd.skip.filter(id => foodIds.has(id)) : null,
    plan: cleanPlan(o.plan)
  };
}
async function pickBackup(file){
  if (!file) return;
  if (file.size > 10*1024*1024) { toast('That file is too big to be a Liftling backup.'); return; }
  let text; try { text = await file.text(); } catch(e){ toast('Couldn’t read that file.'); return; }
  try {
    const b = readBackup(text), have = new Set(store.sessions.map(s => s.id));
    state.importing = {name:file.name, b, fresh:b.sessions.filter(s => !have.has(s.id)).length};
    softRender();
  } catch(err){ toast(err.message); }
}

/* ================= coach ================= */
/* Rule-based plan builder. Picks a split for the number of gym days, fills each workout's movement slots from
   the library with the equipment the person has, and sets sets/reps from goal, experience and age.
   Under-18s get youth resistance-training guidance: form first, moderate loads, no max attempts. */
const SLOTS = {
  'Full Body A':['squat','pushh','pullv','ham','pushv','core'],
  'Full Body B':['squat','pullh','pushh','hinge','rear','core'],
  'Full Body C':['lunge','pushh','pullv','hinge','pullh','core'],
  'Upper A':['pushh','pullv','pushv','pullh','bi','tri'],
  'Lower A':['squat','hinge','lunge','ham','calf','core'],
  'Upper B':['pushv','pullh','pushh','pullv','delt','rear'],
  'Lower B':['hinge','squat','quad','lunge','calf','core'],
  Push:['pushh','pushv','pushh','delt','tri','core'],
  Pull:['pullv','pullh','rear','pullh','bi','core'],
  Legs:['squat','hinge','lunge','ham','calf','core']
};
const COMPOUND = new Set(['squat','lunge','hinge','pushh','pushv','pullv','pullh']);
/* rough first-session weights as a share of bodyweight, for people new-ish to lifting (assist rounds to 10) */
const START_SHARE = {assistpull:[.6,.4], goblet:[.12,.2], dbbench:[.08,.12], inclinedb:[.07,.1], dbpress:[.06,.09], dbrow:[.1,.15], dbrdl:[.1,.15]};
function coachPlan(){
  const p = store.plan, pr = p.profile, age = Number(pr.age), bw = Number(pr.weight) || 0;
  const kid = age < 13, teen = age < 18, young = age < 16, newbie = pr.exp === 'new', expd = pr.exp === 'exp';
  const allowed = {gym:'gdbw', dumbbells:'dw', home:'w'}[pr.equip], barbell = expd && !young && pr.equip === 'gym';
  const pref = pr.equip === 'gym' ? (expd ? 'bdgw' : 'gdwb') : 'dw';
  const cands = pat => Object.keys(EX).filter(id => EX[id].pat === pat && allowed.includes(EX[id].eq) && (!EX[id].adv || barbell))
    .sort((a,b) => pref.indexOf(EX[a].eq) - pref.indexOf(EX[b].eq));
  const n = p.days.length;
  const names = n <= 1 ? ['Full Body A'] : n === 2 ? ['Full Body A','Full Body B'] : n === 3 ? ['Full Body A','Full Body B','Full Body C']
    : (n === 4 || young || newbie) ? ['Upper A','Lower A','Upper B','Lower B'] : ['Push','Pull','Legs'];
  let cardio = {fitness:30, sport:20, strength:15, muscle:15}[pr.goal];
  if (p.length < 60) cardio = Math.min(cardio, 10);
  if (p.length < 45) cardio = 0;
  const shell = p.length >= 75 ? 30 : 20, nEx = Math.max(3, Math.min(6, Math.round((p.length - shell - cardio) / 11)));
  const scheme = id => {
    const e = EX[id], comp = COMPOUND.has(e.pat), sets = kid ? 2 : 3;
    if (e.kind === 'time') return {sets, lo: newbie || young ? 20 : 30, hi: newbie || young ? 30 : 45};
    if (e.kind === 'reps') return e.pat === 'core' ? {sets, lo:10, hi:15} : {sets, lo:8, hi: e.pat === 'squat' ? 20 : 15};
    if (kid) return {sets:2, lo:12, hi:15};
    if (newbie || young) return comp ? {sets:3, lo:10, hi:12} : {sets:2, lo:12, hi:15};
    const g = {strength: comp ? [teen ? 3 : 4, teen ? 6 : 5, teen ? 10 : 8] : [3,8,12], muscle: comp ? [3,8,12] : [3,10,15],
      sport: comp ? [3,6,10] : [2,10,12], fitness: comp ? [3,10,15] : [2,12,15]}[pr.goal];
    return {sets:g[0], lo:g[1], hi:g[2]};
  };
  const startFor = id => {
    const share = START_SHARE[id];
    if (!share || !bw || expd) return {};
    const r = id === 'assistpull' ? 10 : 5;
    return {start: Math.max(5, Math.round(bw * share[newbie ? 0 : 1] / r) * r)};
  };
  const usage = {};
  const workouts = names.map(nm => {
    const main = SLOTS[nm].filter(s => s !== 'core'), hasCore = SLOTS[nm].includes('core');
    const slots = hasCore ? main.slice(0, nEx - 1).concat('core') : main.slice(0, nEx);
    const used = new Set(), ex = [];
    slots.forEach(pat => {
      const c = cands(pat), k = usage[pat] || 0;
      usage[pat] = k + 1;
      const id = c.map((_, t) => c[(k + t) % c.length]).find(x => !used.has(x));
      if (id) { used.add(id); ex.push(Object.assign({id}, scheme(id), startFor(id))); }
    });
    return {name: names.length === 1 ? 'Full Body' : nm, ex};
  });
  const notes = [];
  if (kid) notes.push('Train with a parent, coach or trainer nearby, and keep the weights light.');
  else if (teen) notes.push('Form comes first while you’re growing. Skip one-rep max attempts and ask a coach or trainer to check your technique.');
  if (newbie) notes.push('Spend the first two weeks learning each move with light weights.');
  notes.push('Pick weights that leave 1–2 good reps in the tank. Once you hit the top of the rep range on every set, add a little weight.');
  if (n >= 5) notes.push('Take at least one full rest day each week. Muscles grow while you recover.');
  if (pr.equip === 'home') notes.push('When the reps get easy, slow each rep down or pause at the bottom to make it harder.');
  if (bw && !expd) notes.push('Starting weights are rough guesses from your bodyweight. Go lighter if your form slips.');
  notes.push(teen ? 'Sleep is part of the plan: teens need 8–10 hours.' : 'Sleep is part of the plan: aim for 7–9 hours.');
  return {source:'The coach', workouts, custom:{}, cardio, notes};
}

function aiPrompt(){

  const lib = Object.entries(EX).map(([id, e]) => `${id}: ${e.name} (${e.kind}, ${EQ_NAMES[e.eq].toLowerCase()})`).join('\n');
  const system = `You are a careful strength coach writing a gym plan for Liftling, a workout log app. Many users are teenagers.
Rules:

- Never give calorie, dieting, weight-loss, body-fat or supplement advice, and never comment on the person's body or weight.

- Prefer exercises from the library by id. You may add other common, safe exercises by name.

For an exercise not in the library, replace "id" with "name", "kind" and a one-sentence form tip in "cue".

Library:
${lib}`;
  const user = `About me: age ${pr.age || 'not given'}, bodyweight ${pr.weight ? pr.weight + ' lb' : 'not given'}, experience: ${EXP_TEXT[pr.exp].toLowerCase()}, goal: ${GOAL_TEXT[pr.goal].toLowerCase()}, equipment: ${EQUIP_TEXT[pr.equip].toLowerCase()}.
Schedule: ${p.days.length} gym day${p.days.length === 1 ? '' : 's'} a week (${daysText()}), ${p.length}-minute sessions including a ${ph.warm}-minute warm-up and ${ph.stretch}-minute stretch. Please build my plan.`;

const apiError = (res, j) => {
  const m = j && ((j.error && (j.error.message || (typeof j.error === 'string' && j.error))) || j.message);
  return `${res.status === 401 || res.status === 403 ? 'The API key was turned down' : 'The AI service sent back an error'} (${res.status})${typeof m === 'string' ? ': ' + m.slice(0, 160) : ''}`;
};
async function callAI(){
  const c = aiCfg(), P = PROVIDERS[c.provider], model = c.model.trim() || P.model, {system, user} = aiPrompt();
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 120000);
  try {
    let res, j, text;
    if (c.provider === 'anthropic') {
      res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal:ctl.signal,
        headers:{'content-type':'application/json', 'x-api-key':c.key.trim(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model, max_tokens:4000, system, messages:[{role:'user', content:user}]})});
      j = await res.json().catch(() => null);
      if (!res.ok) throw new Error(apiError(res, j));
      text = ((j && j.content) || []).filter(b => b.type === 'text').map(b => b.text).join('');
    } else {
      const base = (c.provider === 'custom' ? c.base : P.base).trim().replace(/\/+$/, '');
      const headers = {'content-type':'application/json'};
      if (c.key.trim()) headers.authorization = 'Bearer ' + c.key.trim();
      res = await fetch(base + '/chat/completions', {method:'POST', signal:ctl.signal, headers,
        body:JSON.stringify({model, messages:[{role:'system', content:system}, {role:'user', content:user}]})});
      j = await res.json().catch(() => null);
      if (!res.ok) throw new Error(apiError(res, j));
      const msg = j && j.choices && j.choices[0] && j.choices[0].message;
      text = msg ? (Array.isArray(msg.content) ? msg.content.map(x => x.text || '').join('') : String(msg.content || '')) : '';
    }
    return readAiPlan(text, `${P.name} · ${model}`);
  } catch(e) {
    if (e.name === 'AbortError') throw new Error('The AI took too long to answer. Try again.');
    if (e instanceof TypeError) throw new Error(`Couldn’t reach ${P.name}. Check your internet${c.provider === 'custom' ? ', and that your server allows requests from this site' : ''}.`);
    throw e;
  } finally { clearTimeout(timer); }
}
/* the answer is outside data: rebuild it from known fields, map names to the library, cap every number */
function readAiPlan(text, source){
  let o; try { o = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1)); } catch(e){ throw new Error('The AI answer wasn’t in a form Liftling can read. Try asking again.'); }
  const custom = {}, byName = {};
  Object.entries(EX).forEach(([id, e]) => byName[e.name.toLowerCase()] = id);
  const workouts = (Array.isArray(o && o.workouts) ? o.workouts : []).slice(0, 6).map((w, i) => {
    const ex = [], seen = new Set();
    (Array.isArray(w && w.exercises) ? w.exercises : []).slice(0, 10).forEach(x => {
      if (!x || typeof x !== 'object') return;
      let id = typeof x.id === 'string' && EX[x.id] ? x.id : byName[String(x.name || '').trim().toLowerCase()];
      if (!id) {
        const name = String(x.name || '').trim().slice(0, 40);
        if (!name) return;
        id = 'cx_' + (slug(name) || 'move') + '_' + Math.random().toString(36).slice(2, 6);
        custom[id] = {name, kind: KINDS[x.kind] ? x.kind : 'weight', cue: typeof x.cue === 'string' ? x.cue.slice(0, 300) : ''};
      }
      if (seen.has(id)) return;
      seen.add(id);
      ex.push(cleanItem(Object.assign({}, x, {id}), (EX[id] || custom[id]).kind));
    });
    return {name: String((w && w.name) || 'Workout ' + LETTERS[i]).trim().slice(0, 40), ex};
  }).filter(w => w.ex.length);
  if (!workouts.length) throw new Error('The AI didn’t suggest any exercises Liftling could use. Try asking again.');
  const notes = (Array.isArray(o.notes) ? o.notes : []).filter(n => typeof n === 'string' && n.trim()).slice(0, 5).map(n => n.trim().slice(0, 240));
  return {source, workouts, custom, cardio:clampN(o.cardio, 0, 60, store.plan.cardio), notes};
}
